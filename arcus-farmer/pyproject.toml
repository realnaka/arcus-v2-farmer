[project]
name = "arcus-farmer"
version = "0.1.0"
description = "Arcus perpetual v2 point farming: a delta-neutral basket, its schedule and its risk rails"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
